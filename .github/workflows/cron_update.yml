name: Automated Eco-Monitoring Update

# Настройка триггеров запуска
on:
  schedule:
    # Запуск каждый день в 06:00 UTC (09:00 по МСК)
    - cron: '0 6 * * *'
  workflow_dispatch: # Позволяет запускать скрипт вручную кнопкой в интерфейсе GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий на сервер GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Разворачиваем Python окружение
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Устанавливаем зависимости (если будут нужны библиотеки вроде requests или beautifulsoup4)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install requests beautifulsoup4 # Раскомментируйте, когда добавите парсер

      # 4. Запускаем наш скрипт обновления данных
      - name: Run update script
        run: python update_lakes.py

      # 5. Проверяем изменения и пушим их обратно в репозиторий, если lakes.json обновился
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add lakes.json
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Автоматическое обновление статусов водоемов [skip ci]"
            git push origin master
          else
            echo "Нет изменений для коммита."
          fi
