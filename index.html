<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakes of Leningrad Oblast</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #f8f9fa;
        }
        #map-container {
            flex: 1;
            height: 100vh;
            position: relative;
            background-color: #bcd6fc;
            cursor: grab;
            overflow: hidden;
        }
        #map-container:active {
            cursor: grabbing;
        }
        #svg-viewport {
            position: absolute;
            transform-origin: 0 0;
            width: 1000px;
            height: 800px;
        }
        .map-marker {
            cursor: pointer;
            transition: transform 0.15s, r 0.15s;
        }
        .map-marker:hover {
            transform: scale(1.4);
            transform-origin: center;
        }
        .sidebar {
            width: 350px;
            padding: 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
            background: white;
            z-index: 1000;
        }
        .statistics, .filter-section {
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 8px;
            background-color: #fff;
        }
        .lake-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .lake-item:hover {
            background-color: #f1f3f5;
        }
        .status-safe { color: #2b8a3e; font-weight: bold; }
        .status-unsafe { color: #c92a2a; font-weight: bold; }
        h3 { margin: 0 0 5px 0; font-size: 1.1rem; color: #333; }
        p { margin: 3px 0; color: #666; font-size: 0.9rem; }

        .custom-popup {
            position: absolute;
            background: rgba(255, 255, 255, 0.96);
            color: #212529;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: none;
            z-index: 2000;
            max-width: 260px;
            pointer-events: none;
            border: 1px solid #dee2e6;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <svg id="svg-viewport" viewBox="0 0 1000 800">
            <!-- Контур суши -->
            <path d="M 50,450 L 120,400 L 150,410 L 180,350 L 160,280 L 250,250 L 320,180 L 380,210 L 400,150 L 480,160 L 520,100 L 590,140 L 620,80 L 720,120 L 780,250 L 850,220 L 920,340 L 890,520 L 950,580 L 820,680 L 710,620 L 650,710 L 520,640 L 410,690 L 350,610 L 220,640 L 180,550 L 110,580 Z"
                  fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3" />

            <!-- Сетка дорог -->
            <path d="M 320,180 Q 420,380 410,690 M 180,350 L 480,160 M 250,250 L 720,120"
                  fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,5" />

            <!-- Контур Ладожского озера -->
            <path d="M 420,170 Q 500,100 620,180 T 560,380 Q 460,330 420,170 Z"
                  fill="#bcd6fc" stroke="#93c5fd" stroke-width="2" />

            <!-- Слой маркеров -->
            <g id="svg-markers-group"></g>
        </svg>
        <div id="map-popup" class="custom-popup"></div>
    </div>

    <div class="sidebar">
        <h2>Lakes of Leningrad Oblast</h2>
        <p>Eco-monitoring application compiled on a 100% autonomous vector GIS engine.</p>

        <div class="statistics">
            <h4>📊 Quick Statistics</h4>
            <p>Total Lakes Checked: <strong id="total-lakes">0</strong></p>
            <p>Safe (Allowed): <strong id="safe-lakes" class="status-safe">0</strong></p>
            <p>Unsafe (Prohibited): <strong id="unsafe-lakes" class="status-unsafe">0</strong></p>
        </div>

        <div class="filter-section">
            <label for="status-filter" style="font-weight: 500;">Filter by Safety Status:</label>
            <select id="status-filter" style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">
                <option value="all">Show All Lakes</option>
                <option value="safe">Safe Only</option>
                <option value="unsafe">Unsafe Only</option>
            </select>
        </div>

        <div id="lakes-container">
            <p id="loading-text" style="color: #888; text-align: center;">Loading database...</p>
        </div>
    </div>

    <!-- Путь изменен на относительный для GitHub Pages -->
    <script src="index.js"></script>
</body>
</html>
